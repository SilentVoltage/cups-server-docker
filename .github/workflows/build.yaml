name: Build and Publish Docker image

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  schedule:
    # Weekly rebuild picks up Debian security updates.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into what they need.
permissions:
  contents: read

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: ${{ vars.GHCR_REPOSITORY }}/cups-server
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/cups-server
  PLATFORMS: linux/amd64,linux/arm64
  CUPS_DRIVER_PACKAGES: ${{ vars.CUPS_DRIVER_PACKAGES || 'printer-driver-cups-pdf printer-driver-gutenprint printer-driver-escpr foomatic-db-compressed-ppds' }}
  RUFF_VERSION: "0.16.1"
  TRIVY_VERSION: "v0.76.1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Lint shell scripts (shellcheck)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning rootfs/usr/local/bin/*.sh test/*.sh

      - name: Lint Python exporter (ruff)
        run: |
          pipx install "ruff==${RUFF_VERSION}"
          ruff check --config ruff.toml rootfs/opt/cups-exporter/
          ruff format --check --config ruff.toml rootfs/opt/cups-exporter/

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR
      id-token: write          # cosign keyless
      security-events: write   # upload Trivy SARIF
      actions: read            # codeql-action/upload-sarif on private repos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Test and scan one native build before anything is pushed; a multi-arch
      # image with attestations cannot be loaded into the local Docker.
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cups-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CUPS_DRIVER_PACKAGES=${{ env.CUPS_DRIVER_PACKAGES }}

      - name: Smoke test
        run: ./test/smoke.sh cups-server:ci

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: cups-server:ci
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          vuln-type: os,library

      # Code scanning is free on public repos only; private ones need GitHub Code Security.
      - name: Upload Trivy results to code scanning
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: cups-server:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library
        env:
          # Reuse the vuln DB the SARIF scan above already pulled.
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # scoped access token, not the account password

      - name: Derive image metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=cups-server
            org.opencontainers.image.description=CUPS print server

      - name: Build and push (multi-arch)
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            CUPS_DRIVER_PACKAGES=${{ env.CUPS_DRIVER_PACKAGES }}

      - name: Set up cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign images (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY_GHCR}/${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes "${DOCKERHUB_IMAGE}@${DIGEST}"

      - name: Update Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: ./README.md

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Whole history: a secret removed later is still in old commits.
          fetch-depth: 0

      - name: Set up gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$url/$file"
          curl -fsSL "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks && rm "$file"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan git history for secrets (gitleaks)
        run: gitleaks git --redact --verbose .
